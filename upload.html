<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Upload - PA School Data</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
      <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
        <h1 class="text-3xl font-bold text-gray-900 mb-2">File Upload</h1>
        <p class="text-gray-600 mb-6">Upload PVAAS, PSSA, or Keystone data files</p>

        <div class="space-y-6">
          <!-- Type Selection -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Data Type</label>
            <select id="type" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="pvaas">PVAAS (Growth Data)</option>
              <option value="pssa">PSSA (Test Results)</option>
              <option value="keystone">Keystone (Test Results)</option>
            </select>
          </div>

          <!-- Level Selection -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Level</label>
            <select id="level" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
              <option value="school">School Level</option>
              <option value="district">District Level</option>
              <option value="county">County Level</option>
              <option value="state">State Level</option>
            </select>
          </div>

          <!-- File Selection -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Select Files</label>
            <input type="file" id="files" multiple accept=".xlsx,.xls"
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <p class="text-sm text-gray-500 mt-1">Only Excel files (.xlsx, .xls) are allowed. Maximum 100MB per file.</p>
          </div>

          <!-- Selected Files Preview -->
          <div id="file-preview" class="hidden bg-gray-50 rounded-md p-4">
            <h3 class="text-sm font-medium text-gray-700 mb-2">Selected Files</h3>
            <ul id="file-list" class="space-y-1"></ul>
          </div>

          <!-- Error Message -->
          <div id="error" class="hidden bg-red-50 border border-red-200 rounded-md p-4">
            <p class="text-sm text-red-600"></p>
          </div>

          <!-- Upload Button -->
          <button id="upload-btn" onclick="handleUpload()"
            class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
            Upload Files
          </button>

          <!-- Upload Path Info -->
          <div class="bg-blue-50 border border-blue-200 rounded-md p-4">
            <p class="text-sm text-blue-800">
              <strong>Upload destination:</strong><br>
              <code id="destination" class="text-xs bg-blue-100 px-2 py-1 rounded">/sources/pvaas/school/</code>
            </p>
          </div>
        </div>
      </div>

      <!-- Recently Uploaded Files -->
      <div id="uploaded-section" class="hidden bg-white rounded-lg shadow-lg p-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Recently Uploaded</h2>
        <div id="uploaded-list" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000';

    function updateDestination() {
      const type = document.getElementById('type').value;
      const level = document.getElementById('level').value;
      document.getElementById('destination').textContent = '/sources/' + type + '/' + level + '/';
    }

    document.getElementById('type').addEventListener('change', updateDestination);
    document.getElementById('level').addEventListener('change', updateDestination);

    document.getElementById('files').addEventListener('change', function(e) {
      const files = e.target.files;
      const preview = document.getElementById('file-preview');
      const list = document.getElementById('file-list');

      if (files.length > 0) {
        preview.classList.remove('hidden');
        list.innerHTML = '';
        for (let i = 0; i < files.length; i++) {
          const li = document.createElement('li');
          li.className = 'text-sm text-gray-600';
          li.textContent = '• ' + files[i].name + ' (' + formatBytes(files[i].size) + ')';
          list.appendChild(li);
        }
      } else {
        preview.classList.add('hidden');
      }
    });

    async function handleUpload() {
      const filesInput = document.getElementById('files');
      const files = filesInput.files;
      const type = document.getElementById('type').value;
      const level = document.getElementById('level').value;
      const btn = document.getElementById('upload-btn');
      const error = document.getElementById('error');

      error.classList.add('hidden');

      if (files.length === 0) {
        showError('Please select at least one file');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Uploading...';

      try {
        const results = [];
        for (let i = 0; i < files.length; i++) {
          const formData = new FormData();
          formData.append('file', files[i]);

          const response = await fetch(
            API_URL + '/api/upload/upload?type=' + type + '&level=' + level,
            {
              method: 'POST',
              body: formData
            }
          );

          if (!response.ok) {
            throw new Error('Failed to upload ' + files[i].name);
          }

          const result = await response.json();
          results.push(result.file);
        }

        showUploaded(results);
        filesInput.value = '';
        document.getElementById('file-preview').classList.add('hidden');
        alert('Successfully uploaded ' + results.length + ' file(s)!');

      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload Files';
      }
    }

    function showError(message) {
      const error = document.getElementById('error');
      error.querySelector('p').textContent = message;
      error.classList.remove('hidden');
    }

    function showUploaded(files) {
      const section = document.getElementById('uploaded-section');
      const list = document.getElementById('uploaded-list');

      section.classList.remove('hidden');

      files.forEach(function(file) {
        const div = document.createElement('div');
        div.className = 'flex justify-between items-center p-3 bg-gray-50 rounded-md';
        div.innerHTML = '<div><p class="font-medium text-gray-900">' + file.filename + '</p><p class="text-sm text-gray-500">' + file.path + '</p></div><span class="text-sm text-gray-600">' + formatBytes(file.size) + '</span>';
        list.prepend(div);
      });
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }
  </script>
</body>
</html>
