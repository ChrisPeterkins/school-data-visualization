name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build shared types
        run: npm run build -w shared
      - name: Typecheck
        run: npm run typecheck --workspaces --if-present
      - name: Test
        run: npm test --workspaces --if-present
